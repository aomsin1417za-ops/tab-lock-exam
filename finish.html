<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab-Lock — ส่งกระดาษคำตอบเรียบร้อยแล้ว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kanit:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f0f9ff 50%, #faf5ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(244, 114, 182, 0.25);
            box-shadow: 0 25px 60px -15px rgba(236, 72, 153, 0.15), 0 12px 30px -5px rgba(56, 189, 248, 0.1);
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .pulse-glow {
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(244, 114, 182, 0.15); }
            100% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.35); }
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 relative overflow-x-hidden">
    
    <!-- Dynamic Glowing Backdrop Lights -->
    <div class="fixed w-[400px] h-[400px] bg-pink-400/20 blur-[120px] rounded-full -top-20 -left-20 pointer-events-none"></div>
    <div class="fixed w-[450px] h-[450px] bg-sky-400/20 blur-[130px] rounded-full -bottom-20 -right-20 pointer-events-none"></div>
    <div class="fixed w-[350px] h-[350px] bg-purple-400/15 blur-[100px] rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

    <!-- Main Finish Card -->
    <div class="w-full max-w-md glass-card p-6 sm:p-9 rounded-3xl text-center space-y-6 z-10 relative">
        
        <!-- Header Mascot Icon -->
        <div class="relative inline-block">
            <div class="absolute inset-0 bg-gradient-to-tr from-pink-400 to-sky-400 rounded-full blur-md opacity-40 animate-pulse"></div>
            <div class="relative w-24 h-24 bg-white border-2 border-pink-100 rounded-full flex items-center justify-center text-5xl shadow-lg select-none animate-float mx-auto" id="mascot-emoji">
                🎉
            </div>
        </div>

        <div class="space-y-1.5">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight bg-gradient-to-r from-pink-600 via-purple-600 to-sky-600 bg-clip-text text-transparent">
                ส่งข้อสอบสำเร็จเรียบร้อย!
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 font-medium">ระบบได้บันทึกคำตอบของคุณเข้าสู่คลังฐานข้อมูลแล้ว</p>
        </div>

        <!-- Student Information Card -->
        <div class="bg-gradient-to-br from-white/90 to-slate-50/80 border border-slate-200/80 p-4.5 rounded-2xl text-left text-xs space-y-2.5 shadow-sm">
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-pink-500">👤</span> ผู้เข้าสอบ:
                </span>
                <strong class="text-slate-800 font-bold" id="display-name">กำลังดึงข้อมูล...</strong>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-sky-500">🆔</span> รหัสนักศึกษา:
                </span>
                <strong class="text-slate-800 font-mono font-bold" id="display-id">-</strong>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-purple-500">🚪</span> ห้องสอบ:
                </span>
                <strong class="text-sky-600 font-mono font-bold bg-sky-50 px-2.5 py-0.5 rounded-lg border border-sky-100" id="display-room">-</strong>
            </div>
        </div>

        <!-- Score & Teasing Container -->
        <div class="border-t border-pink-100/80 pt-5 space-y-4">
            
            <!-- Score Section (Toggleable) -->
            <div id="score-section" class="hidden space-y-3">
                <div class="text-[11px] font-black text-slate-400 uppercase tracking-widest">คะแนนสอบที่คุณทำได้</div>
                
                <div class="inline-flex items-baseline justify-center gap-1.5 px-6 py-3 bg-gradient-to-r from-pink-50 via-purple-50 to-sky-50 border border-pink-200/60 rounded-2xl shadow-inner pulse-glow">
                    <span class="text-3xl font-black text-pink-600 font-mono" id="score-num">0</span>
                    <span class="text-lg font-bold text-slate-400">/</span>
                    <span class="text-xl font-bold text-slate-600 font-mono" id="max-score-num">0</span>
                    <span class="text-xs font-bold text-slate-500 ml-1">คะแนน</span>
                </div>
                
                <!-- Score Bar Fill -->
                <div class="w-full bg-slate-100 border border-slate-200 h-3 rounded-full overflow-hidden p-0.5 shadow-inner">
                    <div id="score-bar-fill" class="bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 h-full rounded-full transition-all duration-1000 shadow-sm" style="width: 0%"></div>
                </div>
            </div>

            <!-- Funny Teasing Quote Banner -->
            <div class="p-4 bg-gradient-to-r from-pink-50/70 via-purple-50/50 to-sky-50/70 border border-pink-100 rounded-2xl shadow-xs">
                <p id="teasing-quote" class="text-xs text-slate-600 leading-relaxed font-semibold">
                    กำลังประมวลผลคำตอบ... 🧐
                </p>
            </div>

        </div>

        <!-- Lobby Action Buttons -->
        <div class="pt-2 flex flex-col gap-3">
            <a href="student-portal.html" 
                class="block w-full text-center py-3.5 bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 hover:from-pink-600 hover:to-sky-600 text-white rounded-2xl font-bold text-sm transition-all duration-300 shadow-lg shadow-pink-500/25 active:scale-[0.98]">
                🎓 กลับสู่หน้าหลักนักศึกษา (Student Portal)
            </a>
            <a href="Student-login.html" 
                class="block w-full text-center py-2.5 bg-white/80 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-2xl font-bold text-xs transition duration-200 active:scale-[0.98]">
                ออกจากระบบ / เข้าสู่ระบบใหม่
            </a>
        </div>

    </div>

    <script>
        function getUrlParams() {
            const params = {};
            const search = window.location.search.substring(1);
            if (!search) return params;
            
            const pairs = search.split("&");
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split("=");
                params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || "");
            }
            return params;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = getUrlParams();
            
            if (!params.roomId) {
                document.getElementById('display-name').textContent = "คนแอบแฝง";
                document.getElementById('display-id').textContent = "999999";
                document.getElementById('display-room').textContent = "ลับเฉพาะ";
                document.getElementById('mascot-emoji').textContent = "🤨";
                document.getElementById('teasing-quote').textContent = "แอบลิงก์เข้ามาตรงๆ โดยไม่ได้ทำข้อสอบใช่ไหมล่ะเรา? รู้นะ! กลับไปล็อกอินสอบก่อนนะวัยรุ่น 😜";
                return;
            }

            document.getElementById('display-name').textContent = params.studentName || 'ไม่ระบุชื่อ';
            document.getElementById('display-id').textContent = params.studentId || '-';
            document.getElementById('display-room').textContent = params.roomId || '-';

            const score = parseInt(params.score) || 0;
            const maxScore = parseInt(params.maxScore) || 1;
            const showScore = parseInt(params.showScore) === 1;

            const teaseEl = document.getElementById('teasing-quote');
            const emojiEl = document.getElementById('mascot-emoji');

            if (showScore) {
                document.getElementById('score-section').classList.remove('hidden');
                document.getElementById('score-num').textContent = score;
                document.getElementById('max-score-num').textContent = maxScore;
                
                const percent = Math.min(100, Math.max(0, (score / maxScore) * 100));
                setTimeout(() => {
                    document.getElementById('score-bar-fill').style.width = `${percent}%`;
                }, 300);

                if (percent === 100) {
                    emojiEl.textContent = "👑";
                    teaseEl.textContent = "กราบแทบตักคุณพี่ศิษย์เอก! หัวดีเกินมนุษย์ขนาดนี้ ลอกเพื่อนนั่งข้างๆ มาป่ะเนี่ย หรือจารย์เฉลยข้อสอบรั่ว? 🧐";
                } else if (percent >= 70) {
                    emojiEl.textContent = "🚀";
                    teaseEl.textContent = "เก่งไม่ธรรมดาเลยนะเราน่ะ! แอบอ่านสรุปตอนกวาดบ้านหรือพกเครื่องรางวัดดังมาสอบเหรอรอบนี้? ผ่านฉลุยจ้า! 🌟";
                } else if (percent >= 50) {
                    emojiEl.textContent = "🕯️";
                    teaseEl.textContent = "รอดตายหวุดหวิดประหนึ่งปาฏิหาริย์! คะแนนผ่านเส้นยาแดงผ่าแปด สะดุดล้มหน้าคะมำก็ตกอ่ะบอกเลย ทำบุญปล่อยปลาด่วน! 🐟";
                } else {
                    emojiEl.textContent = "💀";
                    teaseEl.textContent = "สอบตกจ้า! นี่คะแนนสอบหรือคะแนนความน่าจะเป็นของอุณหภูมิห้องห้องปรับอากาศ? ต่ำเตี้ยเรี่ยราดปวดใจจี๊ดเลยเพื่อน! 🐶💨";
                }
            } else {
                emojiEl.textContent = "🤫";
                
                const hiddenQuotes = [
                    "ส่งกระดาษคำตอบสำเร็จ! แต่คะแนนเป็นความลับระดับสุดยอด (Top Secret) รอลุ้นเกรดเอาเองนะ ถ้าอาจารย์ไม่อ่านการ์ตูนจนลืมตรวจ! 🤫",
                    "ทำข้อสอบเสร็จแล้วก็รีบปิดคอมพ์ไปวิ่งเล่นข้างนอกซะ! คะแนนของคุณปลอดภัยในระบบดี... (มั้งนะ 🫣)",
                    "บันทึกผลสอบเข้าระบบเรียบร้อย! ส่วนคะแนนนั้น... ลอยอยู่ในหลุมดำ รออาจารย์ปล่อยคิวเฉลยรอบหน้าทีเดียวนะจ๊ะ 🌌"
                ];
                const randomQuoteIndex = (score + maxScore) % hiddenQuotes.length;
                teaseEl.textContent = hiddenQuotes[randomQuoteIndex];
            }
        });
    </script>
</body>
</html>
