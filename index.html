<body>

  <!-- React code with Babel compiler -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, useScroll, useTransform, AnimatePresence } = window.Motion || {
      // Fallback in case Framer Motion UMD fails to load
      motion: {
        div: (props) => <div {...props} />,
        h1: (props) => <h1 {...props} />,
        h2: (props) => <h2 {...props} />,
        span: (props) => <span {...props} />,
        p: (props) => <p {...props} />,

    };

    // --- REUSABLE COMPONENTS ---

    // ContactButton
    const ContactButton = ({ className = '', onClick, label = "เข้าสู่ระบบ 🔒" }) => {
      return (
        <button
          onClick={onClick}
          className={`rounded-full transition-all duration-200 hover:scale-[1.03] active:scale-[0.98] font-medium tracking-wide text-white px-8 py-3 sm:px-10 sm:py-3.5 text-xs sm:text-sm md:text-base shadow-lg hover:shadow-cyan-500/30 ${className}`}
          style={{
            background: 'linear-gradient(135deg, #0891b2 0%, #2563eb 50%, #7c3aed 100%)',

          }}

          {label}

      );
    };

    // LiveProjectButton
    const LiveProjectButton = ({ className = '', onClick, label = "เข้าสู่ระบบ ➔" }) => {
      return (
        <button
          onClick={onClick}
          className={`rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-4 py-2 sm:px-8 sm:py-3 text-xs sm:text-sm md:text-base whitespace-nowrap shrink-0 hover:bg-[#D7E2EA]/10 transition-colors duration-200 active:scale-[0.98] ${className}`}
        >
          {label}
        </button>
      );
    };

    // FadeIn Animation Wrapper
    const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, as = 'div', className = '' }) => {
      const Component = motion[as] || motion.div;
      return (
        <Component
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{
            delay,
            duration,
            ease: [0.25, 0.1, 0.25, 1],
          }}
          className={className}
        >
          {children}
        </Component>
      );
    };

    // Magnet mouse-following hover effect
    const Magnet = ({ children, padding = 150, strength = 3, activeTransition = 'transform 0.3s ease-out', inactiveTransition = 'transform 0.6s ease-in-out', className = '' }) => {
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const [isActive, setIsActive] = useState(false);
      const elementRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!elementRef.current) return;
          const rect = elementRef.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const distanceX = e.clientX - centerX;
          const distanceY = e.clientY - centerY;

          const isInside =
            e.clientX >= rect.left - padding &&
            e.clientX <= rect.right + padding &&
            e.clientY >= rect.top - padding &&
            e.clientY <= rect.bottom + padding;

          if (isInside) {
            setIsActive(true);
            setPosition({
              x: distanceX / strength,
              y: distanceY / strength,
            });
          } else {
            setIsActive(false);
            setPosition({ x: 0, y: 0 });
          }
        };

        const handleMouseLeave = () => {
          setIsActive(false);
          setPosition({ x: 0, y: 0 });
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, [padding, strength]);

      return (
        <div
          ref={elementRef}
          className={`relative inline-block ${className}`}
          style={{
            transform: `translate3d(${position.x}px, ${position.y}px, 0)`,
            transition: isActive ? activeTransition : inactiveTransition,
            willChange: 'transform',
          }}
        >
          {children}
        </div>
      );
    };

    // Character character scroll text reveal component
    const Character = ({ char, index, total, progress }) => {
      if (!progress) return <span className="inline-block">{char === ' ' ? '\u00A0' : char}</span>;
      
      const start = index / total;
      const end = Math.min(1, (index + 8) / total);
      const opacity = useTransform(progress, [start, end], [0.2, 1]);

      if (char === ' ') {
        return <span className="inline-block">&nbsp;</span>;
      }

      return (
        <span className="relative inline-block">
          <span className="opacity-0">{char}</span>
          <motion.span style={{ opacity }} className="absolute inset-0 select-none">
            {char}
          </motion.span>
        </span>
      );
    };

    const AnimatedText = ({ text, className = '', style }) => {
      const containerRef = useRef(null);
      let scrollYProgress = null;

      try {
        const { scrollYProgress: sp } = useScroll({
          target: containerRef,
          offset: ['start 0.8', 'end 0.2'],
        });
        scrollYProgress = sp;
      } catch (e) {
        // Safe fallback in case hooks fail
      }

      const chars = text.split('');
      const total = chars.length;

      return (
        <p ref={containerRef} className={`flex flex-wrap ${className}`} style={style}>
          {chars.map((char, index) => (
            <Character
              key={index}
              char={char}
              index={index}
              total={total}
              progress={scrollYProgress}
            />
          ))}
        </p>
      );
    };

          </FadeIn>

          {/* Hero Content Area: 2-Column Responsive Layout */}

              {/* Left Column: Heading, Info, CTAs */}

                <FadeIn delay={0.1} y={20}>
                  <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-50 border border-cyan-200/80 text-cyan-800 text-xs sm:text-sm font-medium mb-5 shadow-xs">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-cyan-600"></span>
                    </span>
                    <span>ระบบป้องกันการทุจริตการสอบออนไลน์แบบเรียลไทม์</span>
                  </div>
                </FadeIn>

                <FadeIn delay={0.2} y={30}>
                  <h1 className="text-3xl sm:text-5xl lg:text-6xl font-bold text-slate-900 tracking-tight leading-[1.18] mb-4">
                    ONLINE EXAM <br />
                    <span className="hero-heading">PROCTORING SYSTEM</span>
                  </h1>
                </FadeIn>

                <FadeIn delay={0.3} y={30}>
                  <p className="text-slate-600 text-sm sm:text-base md:text-lg leading-relaxed max-w-xl font-normal mb-8">
                    แพลตฟอร์มคุมสอบอัจฉริยะ ตรวจจับการสลับหน้าต่างและแท็บเบราว์เซอร์ พร้อมบันทึกพฤติกรรมผู้เข้าสอบ และวิเคราะห์ผลคะแนนอัตโนมัติ เพื่อการสอบที่โปร่งใส เที่ยงธรรม และปลอดภัยสูงสุด
                  </p>
                </FadeIn>

                <FadeIn delay={0.4} y={30} className="flex flex-wrap items-center justify-center lg:justify-start gap-4 mb-10 w-full">
                  <button
                    onClick={onPortalClick}
                    className="px-7 py-3.5 rounded-2xl text-white font-bold text-sm sm:text-base bg-gradient-to-r from-cyan-600 via-blue-600 to-violet-600 hover:shadow-xl hover:shadow-cyan-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-2.5 shadow-lg shadow-cyan-600/20"
                  >
                    <span>เข้าสู่ระบบสอบออนไลน์</span>
                    <span>🔒</span>
                  </button>
                  <a
                    href="#features"
                    className="px-6 py-3.5 rounded-2xl font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200/90 shadow-sm hover:-translate-y-0.5 transition-all flex items-center gap-2 text-sm sm:text-base"
                  >
                    <span>ดูฟีเจอร์เด่น</span>
                    <span>↓</span>
                  </a>
                </FadeIn>

                {/* Key Metric Highlights */}
                <FadeIn delay={0.5} y={30} className="w-full">
                  <div className="grid grid-cols-3 gap-4 pt-6 border-t border-slate-200/80 max-w-lg mx-auto lg:mx-0 text-left">
                    <div className="flex flex-col">
                      <span className="text-xl sm:text-2xl font-bold text-slate-900">100%</span>
                      <span className="text-xs text-slate-500 font-medium">ตรวจจับสลับหน้าจอ</span>
                    </div>
                    <div className="flex flex-col">
                      <span className="text-xl sm:text-2xl font-bold text-cyan-600">Gemini</span>
                      <span className="text-xs text-slate-500 font-medium">AI สร้างข้อสอบ</span>
                    </div>
                    <div className="flex flex-col">
                      <span className="text-xl sm:text-2xl font-bold text-violet-600">Real-time</span>
                      <span className="text-xs text-slate-500 font-medium">มอนิเตอร์การสอบ</span>
                    </div>
                  </div>
                </FadeIn>
              </div>

              {/* Right Column: Visual Mascot & Interactive Live Badges */}
              <div className="lg:col-span-5 flex justify-center items-center relative mt-4 lg:mt-0">
                {/* Ambient glow behind card */}
                <div className="absolute w-[260px] sm:w-[340px] h-[260px] sm:h-[340px] bg-gradient-to-tr from-cyan-400/20 via-blue-500/20 to-purple-500/20 rounded-full blur-3xl opacity-70 -z-10 animate-pulse pointer-events-none" />

                <FadeIn delay={0.25} y={40}>
                  <div className="relative">
                    <Magnet padding={120} strength={3}>
                      <div className="relative rounded-3xl bg-white p-3 shadow-2xl border border-slate-200/80 max-w-[260px] sm:max-w-[320px] md:max-w-[360px] transition-transform duration-300">
                        <img

                          onError={(e) => { e.target.onerror = null; e.target.src = './images/hero_mascot.png'; }}

                    {/* Floating Status Badge 1 - Top Left */}

                      <span className="text-base">🛡️</span>
                      <div className="text-left">
                        <div className="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Anti-Cheating</div>
                        <div className="text-xs font-bold text-cyan-700">Tab-Lock Active</div>
                      </div>
                    </div>
                  </div>
                </FadeIn>
              </div>

            </div>
          </div>

          {/* Bottom subtle bar */}
          <div className="w-full px-4 sm:px-8 lg:px-12 py-3 border-t border-slate-200/50 bg-white/50 backdrop-blur-xs flex justify-between items-center text-xs text-slate-500 z-20">
            <span>© Tab-Lock Proctoring Platform. All rights reserved.</span>
            <a href="#about" className="hover:text-cyan-600 transition-colors flex items-center gap-1 font-medium">
              <span>เลื่อนลงเพื่อดูรายละเอียด</span>
              <span>↓</span>
            </a>
          </div>
        </section>
      );
    };


    // --- SECTION 2: MARQUEE SECTION ---
    const row1Images = [
      './images/student_exam_ui.jpg',
      './images/student_studying.jpg',
      './images/student_cartoon.jpg',
      './images/teacher_cartoon.jpg',
      './images/teacher_class.jpg',
      './images/teacher_analytics.jpg',
    ];

    const row2Images = [
      './images/admin_cartoon.jpg',
      './images/admin_security.jpg',
      './images/admin_database.jpg',
      './images/exam_security_ui.jpg',
      './images/classroom_stats_ui.jpg',
      './images/ai_question_generation_ui.jpg',
    ];

    const MarqueeSection = () => {
      const sectionRef = useRef(null);
      const [scrollOffset, setScrollOffset] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          if (!sectionRef.current) return;
          const rect = sectionRef.current.getBoundingClientRect();
          const sectionTop = rect.top + window.scrollY;
          const offset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setScrollOffset(offset);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();

        return () => {
          window.removeEventListener('scroll', handleScroll);
        };
      }, []);

      const tripledRow1 = [...row1Images, ...row1Images, ...row1Images];
      const tripledRow2 = [...row2Images, ...row2Images, ...row2Images];

      return (
        <section
          ref={sectionRef}
          className="w-full bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden flex flex-col gap-3"
        >
          <div className="w-full overflow-hidden">
            <div
              className="flex gap-3 w-max"
              style={{
                transform: `translateX(${scrollOffset - 2000}px)`,
                willChange: 'transform',
                transition: 'transform 0.1s ease-out',
              }}
            >
              {tripledRow1.map((url, idx) => (
                <img
                  key={`r1-${idx}`}
                  src={url}
                  alt={`Marquee item ${idx}`}
                  loading="lazy"
                  onError={(e) => { e.target.onerror = null; e.target.src = 'logo.png'; }}
                  className="w-[300px] h-[190px] sm:w-[360px] sm:h-[230px] md:w-[420px] md:h-[270px] rounded-2xl object-cover"
                />
              ))}
            </div>
          </div>

          <div className="w-full overflow-hidden">
            <div
              className="flex gap-3 w-max"
              style={{
                transform: `translateX(-${scrollOffset + 1000}px)`,
                willChange: 'transform',
                transition: 'transform 0.1s ease-out',
              }}
            >
              {tripledRow2.map((url, idx) => (
                <img
                  key={`r2-${idx}`}
                  src={url}
                  alt={`Marquee item ${idx}`}
                  loading="lazy"
                  onError={(e) => { e.target.onerror = null; e.target.src = 'logo.png'; }}
                  className="w-[300px] h-[190px] sm:w-[360px] sm:h-[230px] md:w-[420px] md:h-[270px] rounded-2xl object-cover"
                />
              ))}

    };


    // --- SECTION 3: ABOUT SECTION ---

        <section id="about" className="min-h-screen w-full relative bg-slate-50 px-5 sm:px-8 md:px-10 py-20 flex flex-col justify-center items-center overflow-hidden">

          >
            <img
              src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png"
              alt="Moon icon"
              className="w-[120px] sm:w-[160px] md:w-[210px] h-auto object-contain select-none pointer-events-none"
            />
          </FadeIn>

          {/* 3D object */}
          <FadeIn
            delay={0.25}
            x={-80}
            y={0}
            duration={0.9}
            className="absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] z-0"
          >
            <img
              src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png"
              alt="3D object left"
              className="w-[100px] sm:w-[140px] md:w-[180px] h-auto object-contain select-none pointer-events-none"
            />
          </FadeIn>

          {/* Lego icon */}
          <FadeIn
            delay={0.15}
            x={80}
            y={0}
            duration={0.9}
            className="absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%] z-0"
          >
            <img
